apiVersion: v2
name: beer-shop
description: Helm Umbrella Chart for Beer Shop Microservices Platform
type: application

version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Infrastructure
  - name: mysql
    version: 0.1.0
    repository: "file://charts/mysql"
    condition: mysql.enabled

  - name: redis
    version: 0.1.0
    repository: "file://charts/redis"
    condition: redis.enabled

  - name: mongodb
    version: 0.1.0
    repository: "file://charts/mongodb"
    condition: mongodb.enabled

  - name: kafka
    version: 0.1.0
    repository: "file://charts/kafka"
    condition: kafka.enabled

  - name: consul
    version: 0.1.0
    repository: "file://charts/consul"
    condition: consul.enabled

  - name: jaeger
    version: 0.1.0
    repository: "file://charts/jaeger"
    condition: jaeger.enabled

  # Backend Microservices
  - name: catalog
    version: 0.1.0
    repository: "file://charts/catalog"
    condition: catalog.enabled

  - name: user
    version: 0.1.0
    repository: "file://charts/user"
    condition: user.enabled

  - name: payment
    version: 0.1.0
    repository: "file://charts/payment"
    condition: payment.enabled

  - name: order
    version: 0.1.0
    repository: "file://charts/order"
    condition: order.enabled

  - name: shipping
    version: 0.1.0
    repository: "file://charts/shipping"
    condition: shipping.enabled

  - name: courier
    version: 0.1.0
    repository: "file://charts/courier"
    condition: courier.enabled

  - name: cart
    version: 0.1.0
    repository: "file://charts/cart"
    condition: cart.enabled

  - name: shop-interface
    version: 0.1.0
    repository: "file://charts/shop-interface"
    condition: shop-interface.enabled

  - name: shop-admin
    version: 0.1.0
    repository: "file://charts/shop-admin"
    condition: shop-admin.enabled

  # Frontend
  - name: web-shop
    version: 0.1.0
    repository: "file://charts/web-shop"
    condition: web-shop.enabled

  - name: web-admin
    version: 0.1.0
    repository: "file://charts/web-admin"
    condition: web-admin.enabled