# ==========================================================
# Beer Shop Umbrella Chart
# Global values shared across child charts
# ==========================================================

global:
  namespace: beer-shop

  imagePullPolicy: Always

  storageClass: ""

# ==========================================================
# Infrastructure
# ==========================================================

mysql:
  enabled: true

redis:
  enabled: true

mongodb:
  enabled: true

kafka:
  enabled: true

consul:
  enabled: true

jaeger:
  enabled: true

# ==========================================================
# Backend Services
# ==========================================================

catalog:
  enabled: true

user:
  enabled: true

payment:
  enabled: true

order:
  enabled: true

shipping:
  enabled: true

courier:
  enabled: true

cart:
  enabled: true

shop-interface:
  enabled: true

shop-admin:
  enabled: true

# ==========================================================
# Frontend
# ==========================================================

shop:
  enabled: true

admin:
  enabled: true