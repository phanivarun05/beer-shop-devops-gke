# ==========================================================
# Production Environment (GKE)
# ==========================================================

global:
  namespace: beer-shop

  imagePullPolicy: IfNotPresent

  storageClass: standard-rwo

  environment:
    name: production
    type: production

# ==========================================================
# Infrastructure
# ==========================================================

mysql:
  enabled: true
  replicaCount: 1

redis:
  enabled: true
  replicaCount: 1

mongodb:
  enabled: true
  replicaCount: 1

kafka:
  enabled: true
  replicaCount: 1

consul:
  enabled: true
  replicaCount: 3

jaeger:
  enabled: true
  replicaCount: 1

# ==========================================================
# Backend Services
# ==========================================================

catalog:
  enabled: true
  replicaCount: 3
  
  image:
    tag: "sha-XXXXXXXX"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

