apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}

data:

  config.yaml: |
    {{- toYaml .Values.applicationConfig | nindent 4 }}

  registry.yaml: |
    {{- toYaml .Values.registryConfig | nindent 4 }}
    