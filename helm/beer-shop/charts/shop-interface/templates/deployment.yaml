apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-interface.fullname" . }}
  labels:
    {{- include "shop-interface.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop-interface.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop-interface.selectorLabels" . | nindent 8 }}
    spec:
            {{- if .Values.initContainers.enabled }}
      initContainers:

        {{- range .Values.initContainers.dependencies }}
        - name: wait-for-{{ .name }}
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .name }}:{{ .port }}..."
              until nc -z {{ .name }} {{ .port }}; do
                echo "{{ .name }}:{{ .port }} is not ready. Retrying..."
                sleep 2
              done
              echo "{{ .name }}:{{ .port }} is ready."
        {{- end }}

        {{- range .Values.initContainers.consulServices }}
        - name: wait-for-{{ . | replace "." "-" }}
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for Consul service: {{ . }}..."

              until [ "$(wget -qO- \
                "http://consul:8500/v1/health/service/{{ . }}?passing=1" \
                | wc -c)" -gt 0 ]; do

                echo "Consul service {{ . }} is not ready. Retrying..."
                sleep 3
              done

              echo "Consul service {{ . }} is healthy."
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
          {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.healthcheck.port }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.healthcheck.port }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
      volumes:
        - name: config
          configMap:
            name: {{ include "shop-interface.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
