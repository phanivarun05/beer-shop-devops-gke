name: CI 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  go-tests:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Go Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: beershopapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: beershopapp/go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

  
  docker-build:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all Docker images
        run: make build-docker TAG="sha-${GITHUB_SHA::7}"

      - name: Save Docker images
        run: |
          mkdir -p docker-images
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep '^beer-shop/' \
            | grep ":sha-${GITHUB_SHA::7}$") \
            -o docker-images/beer-shop-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: beer-shop-images-${{ github.sha }}
          path: docker-images/beer-shop-images.tar
          retention-days: 1

  security-scan:
    if: "!startsWith(github.event.head_commit.message, 'chore(gitops):')"
    name: Security Scan
    runs-on: ubuntu-latest

    needs: docker-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: beer-shop-images-${{ github.sha }}
          path: docker-images

      - name: Load Docker images
        run: docker load -i docker-images/beer-shop-images.tar

      - name: Run security scans
        run: make security-scan TAG="sha-${GITHUB_SHA::7}"

  docker-publish:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(gitops):')
    name: Publish Docker Images
    runs-on: ubuntu-latest

    needs:
      - docker-build
      - security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: beer-shop-images-${{ github.sha }}
          path: docker-images

      - name: Load Docker images
        run: docker load -i docker-images/beer-shop-images.tar

      - name: Push Docker images
        run: |
          TAG="sha-${GITHUB_SHA::7}"

          declare -A images=(
            [catalog]="beer-shop-catalog"
            [user]="beer-shop-user"
            [payment]="beer-shop-payment"
            [order]="beer-shop-order"
            [shipping]="beer-shop-shipping"
            [courier]="beer-shop-courier"
            [cart]="beer-shop-cart"
            [shop-interface]="beer-shop-shop-interface"
            [shop-admin]="beer-shop-shop-admin"
            [web-shop]="beer-shop-shop"
            [web-admin]="beer-shop-admin"
          )

          for service in "${!images[@]}"; do
            repository="${images[$service]}"

            docker tag \
              "beer-shop/${service}:${TAG}" \
              "docker.io/${DOCKERHUB_USERNAME}/${repository}:${TAG}"

            docker push \
              "docker.io/${DOCKERHUB_USERNAME}/${repository}:${TAG}"
          done
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"

          git clone \
            "https://x-access-token:${GITOPS_TOKEN}@github.com/phanivarun05/beer-shop-gitops-gke.git" \
            gitops

          cd gitops

          services=(
            catalog
            user
            payment
            order
            shipping
            courier
            cart
            shop-interface
            shop-admin
            web-shop
            web-admin
          )

          for service in "${services[@]}"; do
            sed -i "/^${service}:/,/^[^[:space:]]/ s/^    tag: .*/    tag: \"${TAG}\"/" \
              helm/beer-shop/values-dev.yaml
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/beer-shop/values-dev.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit -m "chore(gitops): update images to ${TAG}"
          git push origin main