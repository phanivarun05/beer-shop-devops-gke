# ==========================================================
# Frontend
# ==========================================================

web-shop:
  enabled: true
  replicaCount: 3

  image:
    tag: "sha-XXXXXXXX"

web-admin:
  enabled: true
  replicaCount: 2

  image:
    tag: "sha-XXXXXXXX"
    
# ==========================================================
# Ingress
# ==========================================================

ingress:
  enabled: true

  annotations:
    kubernetes.io/ingress.class: gce


  hosts:
    - host: shop.example.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: beer-shop-web-shop
            port: 80

    - host: admin.example.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: beer-shop-web-admin
            port: 80

    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
          service:
            name: beer-shop-shop-interface
            port: 8000